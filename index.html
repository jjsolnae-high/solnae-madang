<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔내마당</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
  :root {
    --desk: #2b2622;
    --desk-2: #1d1a17;
    --paper: #f6f1e7;
    --ink: #1c1a18;
    --line: rgba(255,255,255,.14);
    --text: #efe8db;
    --muted: #a99f90;
    --accent: #c9a36a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 35%, #3a332d 0%, var(--desk) 45%, var(--desk-2) 100%);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* 위쪽 바 */
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: calc(6px + env(safe-area-inset-top)) 12px 6px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .picker { position: relative; flex: none; max-width: 62vw; }
  .picker select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 15px; font-weight: 600;
    color: var(--text); background: rgba(255,255,255,.07);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 34px 9px 12px; max-width: 100%;
    text-overflow: ellipsis; cursor: pointer;
  }
  .picker select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .picker option { color: #111; }
  .picker::after {
    content: ""; position: absolute; right: 13px; top: 50%;
    width: 7px; height: 7px; margin-top: -6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); pointer-events: none;
  }
  .brand { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 14px; }
  .brand img { height: 36px; width: auto; flex: none; display: block; }
  .brand .emblem { display: none; }
  .brand .rule { width: 1px; height: 26px; background: var(--line); flex: none; }
  .brand [hidden] { display: none !important; }
  /* 신문 제호 로고: 진한 초록이라 종이색 바탕 위에 올린다 */
  .nameplate { flex: none; background: var(--paper); border-radius: 6px; padding: 3px 9px; line-height: 0; }
  .brand .nameplate img { height: 36px; }
  .masthead {
    text-align: right;
    font-family: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
    font-size: 18px; font-weight: 800; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 신문이 놓이는 자리 */
  main {
    flex: 1; min-width: 0; min-height: 0; position: relative; padding: 6px;
    overflow-x: hidden; overflow-y: auto;
  }
  #stage { width: 100%; height: 100%; position: relative; overflow: visible; }
  #status { position: fixed; }
  #book { position: absolute; transition: transform 1.6s cubic-bezier(.37, 0, .63, 1); filter: drop-shadow(0 18px 28px rgba(0,0,0,.5)); }
  .page { background: var(--paper); overflow: hidden; }
  .page img, .page canvas {
    width: 100%; height: 100%; display: block; object-fit: fill;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  /* 접히는 안쪽(가운데) 그늘 */
  .page::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
  }
  .page.--left::after  { background: linear-gradient(to left,  rgba(0,0,0,.20), rgba(0,0,0,.05) 4%, transparent 11%); }
  .page.--right::after { background: linear-gradient(to right, rgba(0,0,0,.20), rgba(0,0,0,.05) 4%, transparent 11%); }

  /* 불러오는 중 / 안내 */
  #status {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 24px; color: var(--muted); font-size: 15px;
  }
  #status[hidden] { display: none; }
  .bar { width: min(240px, 60vw); height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* 위쪽 바의 보기 버튼들 */
  .tools { display: flex; align-items: center; gap: 6px; flex: none; }
  .tools button, .tools a {
    font: inherit; font-size: 14px; color: var(--text); text-decoration: none; white-space: nowrap;
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 8px; min-width: 40px; height: 40px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .tools button:disabled { opacity: .35; cursor: default; }
  .tools button:focus-visible, .tools a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools [hidden] { display: none; }
  #pageInfo { margin-left: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 신문 양옆의 넘김 화살표 */
  .viewer { flex: 1; min-height: 0; position: relative; display: flex; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
    width: 46px; height: 84px; border-radius: 12px; font-size: 20px; cursor: pointer;
    color: #fff; background: rgba(20,18,16,.6); border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
  }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }
  .nav:hover:not(:disabled) { background: rgba(20,18,16,.85); }
  .nav:disabled { opacity: 0; pointer-events: none; }
  .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 확대 보기 */
  #zoom {
    position: fixed; inset: 0; z-index: 50; background: #141210;
    overflow: auto; touch-action: pan-x pan-y; cursor: grab;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #zoom[hidden] { display: none; }
  #zoom.dragging { cursor: grabbing; }
  #zoom.mouse { cursor: zoom-out; }
  #zoom.mouse.dragging { cursor: grabbing; }
  #zoomInner { display: flex; margin: 0 auto; min-height: 100%; align-items: flex-start; }
  .zpage { flex: 1 1 0; min-width: 0; position: relative; background: #fff; overflow: hidden; }
  .zpage img, .zpage canvas.base {
    width: 100%; height: 100%; display: block;
    user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;
  }
  .zpage canvas.sharp { position: absolute; display: block; }
  .zoombar {
    position: fixed; z-index: 51; right: 12px; top: calc(12px + env(safe-area-inset-top));
    display: flex; gap: 6px; padding: 6px; border-radius: 12px;
    background: rgba(20,18,16,.82); border: 1px solid var(--line);
  }
  .zoombar[hidden] { display: none; }
  .zoombar button {
    font: inherit; font-size: 18px; color: var(--text); background: rgba(255,255,255,.1);
    border: 1px solid var(--line); border-radius: 8px; min-width: 44px; height: 44px; padding: 0 12px; cursor: pointer;
  }
  .zoombar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .zoombar .close { font-size: 14px; }

  footer {
    flex: none; text-align: center; font-size: 11px; color: var(--muted);
    padding: 3px 12px calc(4px + env(safe-area-inset-bottom));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #hint:not(:empty)::after { content: "  ·  "; white-space: pre; }

  /* 창이 넓지 않으면 학교 로고를 원형 문장만 남겨 위쪽 바가 한 줄에 들어가게 한다 */
  @media (max-width: 1180px) {
    .brand { gap: 9px; }
    .brand .full, .brand .rule { display: none; }
    .brand .emblem { display: block; height: 34px; }
  }
  @media (max-width: 760px) {
    .brand .nameplate img { height: 32px; }
    .picker { max-width: 44vw; }
    /* 좁은 화면: 보기 버튼은 둘째 줄로 */
    .tools { order: 3; width: 100%; justify-content: center; }
    .tools button, .tools a { height: 36px; }
    .nav { width: 36px; height: 64px; font-size: 16px; }
    .nav.prev { left: 2px; } .nav.next { right: 2px; }
  }
  @media (max-width: 520px) {
    .masthead { font-size: 15px; }
    main { padding: 4px; }
    #hint { display: none; }
    .tools { gap: 4px; }
    .tools button, .tools a { padding: 0 9px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="picker">
    <select id="issueSelect" aria-label="신문 호 선택"></select>
  </div>
  <div class="tools">
    <button id="fitBtn" aria-pressed="false"></button>
    <button id="zoomBtn" aria-label="확대해서 보기">🔍<span class="label">&nbsp;확대</span></button>
    <button id="fullBtn" aria-label="전체 화면">⛶<span class="label">&nbsp;전체 화면</span></button>
    <a id="pdfLink" target="_blank" rel="noopener" hidden>PDF<span class="label">&nbsp;원본</span></a>
    <span id="pageInfo" aria-live="polite">–</span>
  </div>
  <div class="brand">
    <img class="full" id="logoFull" alt="" hidden>
    <img class="emblem" id="logoEmblem" alt="" hidden>
    <span class="rule" id="logoRule" hidden></span>
    <div class="nameplate" id="nameplate" hidden><img id="nameLogo" alt=""></div>
    <div class="masthead" id="masthead">솔내마당</div>
  </div>
</header>

<div class="viewer">
  <main>
    <div id="stage"></div>
    <div id="status">
      <div id="statusText">신문을 펼치는 중…</div>
      <div class="bar" id="statusBar"><i></i></div>
    </div>
  </main>
  <button class="nav prev" id="prevBtn" aria-label="이전 면">◀</button>
  <button class="nav next" id="nextBtn" aria-label="다음 면">▶</button>
</div>

<div id="zoom" hidden><div id="zoomInner"></div></div>
<div class="zoombar" id="zoomBar" hidden>
  <button id="zoomOut" aria-label="축소">−</button>
  <button id="zoomIn" aria-label="확대">+</button>
  <button id="zoomClose" class="close" aria-label="확대 보기 닫기">닫기 ✕</button>
</div>

<footer><span id="hint"></span><span id="copyright"></span> · v2.0.10</footer>

<script src="issues.js"></script>
<script src="lib/page-flip.browser.js"></script>
<script>
(function () {
  "use strict";

  var SITE = window.SITE || {};
  var ISSUES = (window.ISSUES || []).filter(function (x) { return x && x.title && x.file; });
  var DEMO = { title: "견본 신문 (PDF를 올리면 사라집니다)", demo: true };
  if (!ISSUES.length) ISSUES = [DEMO];

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), statusBox = $("status"), statusText = $("statusText"),
      statusBar = $("statusBar"), select = $("issueSelect"),
      prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), pageInfo = $("pageInfo"),
      pdfLink = $("pdfLink"), fullBtn = $("fullBtn");

  document.title = [SITE.school, SITE.name || "학교신문"].filter(Boolean).join(" ");
  if (SITE.nameLogo) {
    var nl = $("nameLogo");
    nl.alt = SITE.name || "학교신문";
    nl.onload = function () { $("nameplate").hidden = false; $("masthead").hidden = true; };
    nl.src = SITE.nameLogo;
  }
  if (SITE.logo) {
    var lf = $("logoFull"), le = $("logoEmblem");
    lf.src = SITE.logo; le.src = SITE.emblem || SITE.logo;
    lf.alt = le.alt = SITE.school || "학교 로고";
    lf.hidden = le.hidden = false; $("logoRule").hidden = false;
    lf.onerror = le.onerror = function () { this.hidden = true; $("logoRule").hidden = true; };
  }
  $("masthead").textContent = SITE.name || "학교신문";
  $("copyright").textContent = "© " + new Date().getFullYear() + " " + (SITE.school || SITE.name || "");

  var cache = new Map();   // 호별로 열어 둔 신문
  var current = null;      // { count, ratio, pdf?, urls? }
  var flip = null;         // 넘김 효과 객체
  var landscape = true;
  var pageIndex = 0;
  var loadToken = 0;       // 호를 바꿀 때마다 올라간다
  var drawToken = 0;       // 화면을 다시 짤 때마다 올라간다
  var DPR = function () { return Math.min(window.devicePixelRatio || 1, 4); };
  var mainEl = document.querySelector("main"), fitBtn = $("fitBtn");
  var READABLE = 900, BIG_MAX = 1300;   // 한 면 너비(픽셀): 이보다 작으면 본문이 안 읽힌다 / 크게 보기 최대
  var bigMode = true;                   // 처음부터 읽히는 크기로 보여 준다
  try { if (localStorage.getItem("madang-fit") === "whole") bigMode = false; } catch (e) {}
  var SCROLLBAR = (function () {
    var d = document.createElement("div"); d.style.cssText = "position:absolute;top:-99px;width:60px;height:60px;overflow:scroll";
    document.body.appendChild(d); var w = d.offsetWidth - d.clientWidth; d.remove(); return w;
  })();
  function avail() {                    // 신문을 놓을 수 있는 자리
    var cs = getComputedStyle(mainEl);
    return {
      // 세로 스크롤바가 생겨도 너비가 변하지 않도록 스크롤바 자리는 늘 빼고 계산한다
      w: Math.floor(mainEl.offsetWidth - SCROLLBAR - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)),
      h: Math.floor(mainEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom))
    };
  }
  fitBtn.addEventListener("click", function () {
    bigMode = !bigMode;
    try { localStorage.setItem("madang-fit", bigMode ? "big" : "whole"); } catch (e) {}
    buildBook();
  });

  /* ── 목록(드롭다운) ── */
  ISSUES.forEach(function (it, i) {
    var o = document.createElement("option");
    o.value = i; o.textContent = it.title;
    select.appendChild(o);
  });
  select.addEventListener("change", function () { openIssue(+select.value); });

  /* ── 상태 표시 ── */
  function showStatus(msg, progress) {
    statusBox.hidden = false;
    statusText.textContent = msg;
    statusBar.style.display = progress == null ? "none" : "";
    if (progress != null) statusBar.firstElementChild.style.width = Math.round(progress * 100) + "%";
  }
  function hideStatus() { statusBox.hidden = true; }

  /* ── PDF 읽기 도구는 필요할 때만 불러온다 ── */
  var pdfReady = null;
  function loadPdfLib() {
    if (!pdfReady) pdfReady = new Promise(function (ok, fail) {
      var s = document.createElement("script");
      s.src = "lib/pdf.min.js";
      s.onload = function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
        ok(window.pdfjsLib);
      };
      s.onerror = function () { fail(new Error("PDF 도구를 불러오지 못했습니다.")); };
      document.head.appendChild(s);
    });
    return pdfReady;
  }

  /* ── PDF 열기: 면을 그림 파일로 바꿔 두지 않고, 보이는 크기에 딱 맞춰 그때그때 그린다 ── */
  async function openPdf(file) {
    var lib = await loadPdfLib();
    var task = lib.getDocument({ url: file, cMapUrl: "lib/cmaps/", cMapPacked: true });
    // 파일이 열린 뒤에도 나머지를 계속 내려받으며 진행 알림이 오므로, 열린 뒤에는 무시한다
    var opened = false, myLoad = loadToken;
    task.onProgress = function (p) {
      if (opened || myLoad !== loadToken || !p || !p.total) return;
      showStatus("신문을 가져오는 중…", Math.min(1, p.loaded / p.total));
    };
    var pdf = await task.promise;
    opened = true;
    var first = await pdf.getPage(1);
    var vp = first.getViewport({ scale: 1 });
    return { pdf: pdf, count: pdf.numPages, ratio: vp.width / vp.height, pages: { 1: Promise.resolve(first) } };
  }
  function getPage(data, n) {      // n은 1부터
    if (!data.pages[n]) data.pages[n] = data.pdf.getPage(n);
    return data.pages[n];
  }
  // 한 면의 일부(또는 전체)를 캔버스에 그린다. 캔버스 크기 = 실제 화면 점 개수라서 흐려지지 않는다.
  // 일반 모니터(배율 1)에서는 두 배로 그린 뒤 절반으로 줄여 가장자리를 매끈하게 만든다.
  function superSample() { return DPR() < 1.75 ? 2 : 1; }
  function drawPage(data, n, canvas, cssPageWidth, offX, offY) {
    var task = null, cancelled = false;
    var done = getPage(data, n).then(function (page) {
      if (cancelled) return false;
      var base = page.getViewport({ scale: 1 });
      var dpr = DPR(), ss = superSample();
      var vp = page.getViewport({ scale: cssPageWidth * dpr * ss / base.width });
      var target = canvas;
      if (ss > 1) {
        target = document.createElement("canvas");
        target.width = canvas.width * ss; target.height = canvas.height * ss;
      }
      var ctx = target.getContext("2d", { alpha: false });
      thickenPx = dpr * ss; thickenDepth++;
      var release = function () { if (release) { thickenDepth--; release = null; } };
      task = page.render({
        canvasContext: ctx,
        viewport: vp,
        transform: [1, 0, 0, 1, -(offX || 0) * dpr * ss, -(offY || 0) * dpr * ss],
        background: "#ffffff"
      });
      task.promise.then(release, release);
      return task.promise.then(function () {
        if (cancelled) return false;
        if (ss > 1) {
          var out = canvas.getContext("2d", { alpha: false });
          out.imageSmoothingEnabled = true; out.imageSmoothingQuality = "high";
          out.drawImage(target, 0, 0, canvas.width, canvas.height);   // 정확히 절반: 네 점의 평균
          target.width = target.height = 0;
        }
        return true;
      });
    }).catch(function (e) {
      if (e && e.name === "RenderingCancelledException") return false;
      console.error(e); return false;
    });
    return { done: done, cancel: function () { cancelled = true; if (task) task.cancel(); } };
  }
  // 본문이 아주 가는 서체라 화면에서는 옅게 보인다. 작은 글씨일수록 획에 같은 색 테두리를 살짝 둘러
  // 굵기를 보강한다. 글자 모양 자체(벡터)를 굵히는 것이라 가장자리가 거칠어지지 않는다.
  // 화면 글씨 크기 14픽셀 이하에서 최대(0.5픽셀), 30픽셀 이상(제목 등)은 그대로 둔다.
  // PDF 도구는 면에 따라 글자를 내부의 임시 캔버스에 먼저 그리기도 하므로(투명 효과가 있는 면),
  // 특정 캔버스가 아니라 '그리는 동안의 모든 캔버스'에 적용해야 면마다 굵기가 같아진다.
  var thickenDepth = 0, thickenPx = 1;
  (function () {
    var proto = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (!proto) return;
    var fill = proto.fillText;
    proto.fillText = function (text, x, y) {
      fill.apply(this, arguments);
      if (!thickenDepth) return;
      var font = this.font, m = /([\d.]+)px\s+"?g_d/.exec(font);   // PDF에 들어 있는 글꼴만
      if (!m) return;
      var t = this.getTransform();
      var scale = Math.sqrt(t.a * t.a + t.b * t.b);
      var size = parseFloat(m[1]) * scale / thickenPx;            // 화면에서의 글씨 크기
      var extra = Math.min(0.5, 0.04 * size) * Math.max(0, Math.min(1, (30 - size) / 16));
      if (extra < 0.02 || !scale) return;
      var lw = this.lineWidth, st = this.strokeStyle, lj = this.lineJoin;
      this.lineWidth = extra * thickenPx / scale;
      this.strokeStyle = this.fillStyle;
      this.lineJoin = "round";
      this.strokeText(text, x, y);
      this.lineWidth = lw; this.strokeStyle = st; this.lineJoin = lj;
    };
  })();

  /* ── 견본 신문 (올린 PDF가 없을 때) ── */
  function renderDemo() {
    var W = 1000, H = 1414, urls = [], total = 8;
    var serif = '"Nanum Myeongjo","Noto Serif KR","Batang",serif';
    for (var p = 1; p <= total; p++) {
      var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      var c = cv.getContext("2d");
      c.fillStyle = "#f6f1e7"; c.fillRect(0, 0, W, H);
      c.fillStyle = "#1c1a18"; c.textBaseline = "top";
      var y = 60;
      if (p === 1) {
        c.textAlign = "center"; c.font = "800 96px " + serif;
        c.fillText(SITE.name || "학교신문", W / 2, y); y += 130;

  /* ── 조작 ── */

    if (!ptr.folding) return;
    if (ev && ev.cancelable) ev.preventDefault();
    fc.do(render.convertToPage(libPos(cx, cy)));
  }
  function pointerUp(cx, cy) {
    if (!ptr) return;
    var p = ptr; ptr = null;
    if (!flip) return;
    var f = flip, fc = fcOf(), render = f.getRender();
    if (p.folding && fc.calc) {
      var rect = render.getRect(), pw = rect.pageWidth, H = rect.height;
      var from = fc.calc.getPosition(), cornerY = fc.calc.getCorner() === "bottom" ? H : 0;
      var dx = cx - p.x, forward = fc.calc.getDirection() === 0;
      // 넘기려는 방향으로 40픽셀 넘게 끌었거나 절반을 넘겼으면 마저 넘기고, 아니면 되돌린다
      var complete = from.x <= 0 || (forward ? dx < -40 : dx > 40);
      var to = { x: complete ? -pw : pw, y: cornerY };
      fc.animateFlippingTo(from, to, complete);     // 넘기거나 되돌리고, 끝나면 스스로 정리한다
      return;
    }
    if (fc.getState() === "user_fold") fc.setState("read");
    if (p.moved) return;                          // 끌었지만 넘김이 아니었던 경우(스크롤 등)
    var sp = spot(cx, cy);
    if (!sp) return;
    if (sp.onCorner) turn(sp.x < sp.width / 2 ? -1 : 1, sp.y < sp.height / 2);
    else openZoom({ fx: sp.x / sp.width, fyW: sp.y / sp.width });
  }
  function cancelPointer() {                      // 두 손가락이 닿는 등, 넘김을 그만둘 때
    if (ptr && ptr.folding) { var p = ptr; pointerUp(p.x, p.y); }
    ptr = null;
  }

  // 마우스
  stage.addEventListener("mousedown", function (e) {
    if (e.button !== 0 || Date.now() - lastTouch < 800) return;
    if (!spot(e.clientX, e.clientY)) return;
    pointerDown(e.clientX, e.clientY, false); e.preventDefault();
  });
  window.addEventListener("mousemove", function (e) { if (ptr && !ptr.touch) pointerMove(e.clientX, e.clientY, e); });
  window.addEventListener("mouseup", function (e) { if (ptr && !ptr.touch) pointerUp(e.clientX, e.clientY); });
  // 마우스를 올리면: 가운데는 돋보기, 모서리는 종이가 살짝 들리며 손 모양
  stage.addEventListener("mousemove", function (e) {
    var book = $("book"); if (!book || !flip || ptr || Date.now() - lastTouch < 800) return;
    var sp = spot(e.clientX, e.clientY);
    book.style.cursor = !sp ? "" : (sp.onCorner ? "pointer" : "zoom-in");
    var fc = fcOf(), st = fc.getState();
    if (st === "read" || st === "fold_corner") { fc.showCorner(libPos(e.clientX, e.clientY)); }
  });
  stage.addEventListener("mouseleave", function () {
    var fc = fcOf(); if (!fc || ptr) return;
    if (fc.getState() === "fold_corner") fc.showCorner({ x: -9999, y: -9999 });
  });
  // 터치
  stage.addEventListener("touchstart", function (e) {
    lastTouch = Date.now();
    if (e.touches.length === 1) pointerDown(e.touches[0].clientX, e.touches[0].clientY, true);
    else cancelPointer();
  }, { passive: true });
  stage.addEventListener("touchmove", function (e) {
    lastTouch = Date.now();
    if (ptr && e.touches.length === 1) pointerMove(e.touches[0].clientX, e.touches[0].clientY, e);
  }, { passive: false });
  stage.addEventListener("touchend", function (e) {
    lastTouch = Date.now();
    var t = e.changedTouches[0];
    if (ptr && !e.touches.length && t) pointerUp(t.clientX, t.clientY);
  }, { passive: true });
  stage.addEventListener("touchcancel", function () { cancelPointer(); }, { passive: true });

  // 지금 보이는 면들이 차지하는 영역과, 그 안에서 누른 위치
  function spot(clientX, clientY) {
    var book = $("book");
    if (!book || !flip || !current) return null;
    var pages = viewPages(), pw = +book.dataset.pw, r = book.getBoundingClientRect();
    var left = r.left + (landscape && pageIndex === 0 ? pw : 0);
    var width = pw * pages.length, height = r.height;
    var x = clientX - left, y = clientY - r.top;
    if (x < 0 || y < 0 || x > width || y > height) return null;
    var corner = Math.sqrt(pw * pw + height * height) / 5;
    var near = Math.hypot(Math.min(x, width - x), Math.min(y, height - y));
    return { x: x, y: y, width: width, height: height, onCorner: near < corner };
  }
  $("zoomClose").addEventListener("click", closeZoom);
  $("zoomIn").addEventListener("click", function () { setZoom(zLevel * 1.4); });
  $("zoomOut").addEventListener("click", function () { setZoom(zLevel / 1.4); });
  zoomBox.addEventListener("scroll", scheduleSharp, { passive: true });
  // 마우스: 끌지 않고 그냥 누르면 넘겨보기 화면으로 돌아간다
  zoomBox.addEventListener("pointerdown", function (e) { zoomBox.classList.toggle("mouse", e.pointerType === "mouse"); });
  zoomBox.addEventListener("click", function (e) {
    if (zoomBox.classList.contains("mouse") && !dragMoved) closeZoom();
  });
  zoomBox.addEventListener("wheel", function (e) {
    if (!e.ctrlKey && !e.metaKey) return;      // 그냥 휠은 위아래 이동, Ctrl+휠은 확대
    e.preventDefault();
    setZoom(zLevel * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });
  // 마우스로 끌어서 이동
  var drag = null, dragMoved = false;
  zoomBox.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    dragMoved = false;
    drag = { x: e.clientX, y: e.clientY, l: zoomBox.scrollLeft, t: zoomBox.scrollTop };
    zoomBox.classList.add("dragging"); e.preventDefault();
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) dragMoved = true;
    zoomBox.scrollLeft = drag.l - (e.clientX - drag.x);
    zoomBox.scrollTop = drag.t - (e.clientY - drag.y);
  });
  window.addEventListener("mouseup", function () { drag = null; zoomBox.classList.remove("dragging"); });
  // 두 손가락으로 벌리고 오므리기
  var pinch = null;
  function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  zoomBox.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zLevel };
  }, { passive: true });
  zoomBox.addEventListener("touchmove", function (e) {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    var t = e.touches;
    setZoom(pinch.z * dist(t) / pinch.d, (t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);
  }, { passive: false });
  zoomBox.addEventListener("touchend", function (e) { if (e.touches.length < 2) pinch = null; });
  // 넘겨보는 화면에서 두 손가락을 벌리면 확대 보기가 열린다
  var stagePinch = null;
  stage.addEventListener("touchstart", function (e) {
    stagePinch = e.touches.length === 2 ? dist(e.touches) : null;
  }, { passive: true });
  stage.addEventListener("touchmove", function (e) {
    if (stagePinch && e.touches.length === 2 && dist(e.touches) > stagePinch * 1.25) { stagePinch = null; openZoom(); }
  }, { passive: true });

  var root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener("click", function () {
    var on = document.fullscreenElement || document.webkitFullscreenElement;
    if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  });

  var resizeTimer = null, lastW = 0, lastH = 0, lastDpr = DPR();
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (zoomOpen()) setZoom(zLevel);
      var a = avail();
      if (a.w === lastW && a.h === lastH && DPR() === lastDpr) return;
      lastW = a.w; lastH = a.h; lastDpr = DPR();
      buildBook();
    }, 200);
  });

  /* ── 시작: 주소 끝의 #번호로 특정 호를 바로 열 수 있다 ── */
  var start = 0, h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= ISSUES.length) start = ISSUES.length - h;
  lastW = avail().w; lastH = avail().h;
  openIssue(start);
})();
</script>
</body>
