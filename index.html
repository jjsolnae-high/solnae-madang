<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔내마당</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
  :root {
    --desk: #2b2622;
    --desk-2: #1d1a17;
    --paper: #f6f1e7;
    --ink: #1c1a18;
    --line: rgba(255,255,255,.14);
    --text: #efe8db;
    --muted: #a99f90;
    --accent: #c9a36a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 35%, #3a332d 0%, var(--desk) 45%, var(--desk-2) 100%);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* 위쪽 바 */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .picker { position: relative; flex: none; max-width: 62vw; }
  .picker select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 15px; font-weight: 600;
    color: var(--text); background: rgba(255,255,255,.07);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 34px 9px 12px; max-width: 100%;
    text-overflow: ellipsis; cursor: pointer;
  }
  .picker select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .picker option { color: #111; }
  .picker::after {
    content: ""; position: absolute; right: 13px; top: 50%;
    width: 7px; height: 7px; margin-top: -6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); pointer-events: none;
  }
  .brand { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 14px; }
  .brand img { height: 36px; width: auto; flex: none; display: block; }
  .brand .emblem { display: none; }
  .brand .rule { width: 1px; height: 26px; background: var(--line); flex: none; }
  .brand [hidden] { display: none !important; }
  /* 신문 제호 로고: 진한 초록이라 종이색 바탕 위에 올린다 */
  .nameplate { flex: none; background: var(--paper); border-radius: 6px; padding: 5px 10px; line-height: 0; }
  .brand .nameplate img { height: 44px; }
  .masthead {
    text-align: right;
    font-family: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
    font-size: 18px; font-weight: 800; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 신문이 놓이는 자리 */
  main {
    flex: 1; min-height: 0; position: relative; padding: 10px 10px 6px;
    overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable both-edges;
  }
  .hint { flex: none; text-align: center; font-size: 12px; color: var(--muted); padding: 0 12px; }
  #stage { width: 100%; height: 100%; position: relative; overflow: visible; }
  #status { position: fixed; }
  #book { position: absolute; cursor: zoom-in; transition: transform .5s ease; filter: drop-shadow(0 18px 28px rgba(0,0,0,.5)); }
  .page { background: var(--paper); overflow: hidden; }
  .page img, .page canvas {
    width: 100%; height: 100%; display: block; object-fit: fill;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  /* 접히는 안쪽(가운데) 그늘 */
  .page::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
  }
  .page.--left::after  { background: linear-gradient(to left,  rgba(0,0,0,.20), rgba(0,0,0,.05) 4%, transparent 11%); }
  .page.--right::after { background: linear-gradient(to right, rgba(0,0,0,.20), rgba(0,0,0,.05) 4%, transparent 11%); }

  /* 불러오는 중 / 안내 */
  #status {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 24px; color: var(--muted); font-size: 15px;
  }
  #status[hidden] { display: none; }
  .bar { width: min(240px, 60vw); height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* 아래쪽 조작 바 */
  .controls {
    flex: none; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 12px;
  }
  .controls button, .controls a {
    font: inherit; font-size: 14px; color: var(--text); text-decoration: none;
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 8px; min-width: 44px; height: 44px; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .controls button:disabled { opacity: .35; cursor: default; }
  .controls button:focus-visible, .controls a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls [hidden] { display: none; }
  #pageInfo { min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
  .gap { width: 8px; }

  /* 확대 보기 */
  #zoom {
    position: fixed; inset: 0; z-index: 50; background: #141210;
    overflow: auto; touch-action: pan-x pan-y; cursor: grab;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #zoom[hidden] { display: none; }
  #zoom.dragging { cursor: grabbing; }
  #zoom.mouse { cursor: zoom-out; }
  #zoom.mouse.dragging { cursor: grabbing; }
  #zoomInner { display: flex; margin: 0 auto; min-height: 100%; align-items: flex-start; }
  .zpage { flex: 1 1 0; min-width: 0; position: relative; background: #fff; overflow: hidden; }
  .zpage img, .zpage canvas.base {
    width: 100%; height: 100%; display: block;
    user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none;
  }
  .zpage canvas.sharp { position: absolute; display: block; }
  .zoombar {
    position: fixed; z-index: 51; right: 12px; top: calc(12px + env(safe-area-inset-top));
    display: flex; gap: 6px; padding: 6px; border-radius: 12px;
    background: rgba(20,18,16,.82); border: 1px solid var(--line);
  }
  .zoombar[hidden] { display: none; }
  .zoombar button {
    font: inherit; font-size: 18px; color: var(--text); background: rgba(255,255,255,.1);
    border: 1px solid var(--line); border-radius: 8px; min-width: 44px; height: 44px; padding: 0 12px; cursor: pointer;
  }
  .zoombar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .zoombar .close { font-size: 14px; }

  footer {
    flex: none; text-align: center; font-size: 11px; color: var(--muted);
    padding: 2px 12px calc(8px + env(safe-area-inset-bottom));
  }

  @media (max-width: 760px) {
    .brand { gap: 9px; }
    .brand .full, .brand .rule { display: none; }
    .brand .emblem { display: block; height: 34px; }
    .brand .nameplate { padding: 4px 8px; }
    .brand .nameplate img { height: 36px; }
    .picker { max-width: 44vw; }
  }
  @media (max-width: 520px) {
    .masthead { font-size: 15px; }
    main { padding: 10px 6px; }
    .controls .label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #book { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="picker">
    <select id="issueSelect" aria-label="신문 호 선택"></select>
  </div>
  <div class="brand">
    <img class="full" id="logoFull" alt="" hidden>
    <img class="emblem" id="logoEmblem" alt="" hidden>
    <span class="rule" id="logoRule" hidden></span>
    <div class="nameplate" id="nameplate" hidden><img id="nameLogo" alt=""></div>
    <div class="masthead" id="masthead">솔내마당</div>
  </div>
</header>

<main>
  <div id="stage"></div>
  <div id="status">
    <div id="statusText">신문을 펼치는 중…</div>
    <div class="bar" id="statusBar"><i></i></div>
  </div>
</main>

<div class="hint" id="hint"></div>
<div class="controls">
  <button id="prevBtn" aria-label="이전 면">◀</button>
  <div id="pageInfo" aria-live="polite">–</div>
  <button id="nextBtn" aria-label="다음 면">▶</button>
  <span class="gap"></span>
  <button id="fitBtn" aria-pressed="false"></button>
  <button id="zoomBtn" aria-label="확대해서 보기">🔍<span class="label">&nbsp;확대</span></button>
  <button id="fullBtn" aria-label="전체 화면">⛶<span class="label">&nbsp;전체 화면</span></button>
  <a id="pdfLink" target="_blank" rel="noopener" hidden>PDF<span class="label">&nbsp;원본</span></a>
</div>

<div id="zoom" hidden><div id="zoomInner"></div></div>
<div class="zoombar" id="zoomBar" hidden>
  <button id="zoomOut" aria-label="축소">−</button>
  <button id="zoomIn" aria-label="확대">+</button>
  <button id="zoomClose" class="close" aria-label="확대 보기 닫기">닫기 ✕</button>
</div>

<footer><span id="copyright"></span> · v1.6.1</footer>

<script src="issues.js"></script>
<script src="lib/page-flip.browser.js"></script>
<script>
(function () {
  "use strict";

  var SITE = window.SITE || {};
  var ISSUES = (window.ISSUES || []).filter(function (x) { return x && x.title && x.file; });
  var DEMO = { title: "견본 신문 (PDF를 올리면 사라집니다)", demo: true };
  if (!ISSUES.length) ISSUES = [DEMO];

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), statusBox = $("status"), statusText = $("statusText"),
      statusBar = $("statusBar"), select = $("issueSelect"),
      prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), pageInfo = $("pageInfo"),
      pdfLink = $("pdfLink"), fullBtn = $("fullBtn");

  document.title = [SITE.school, SITE.name || "학교신문"].filter(Boolean).join(" ");
  if (SITE.nameLogo) {
    var nl = $("nameLogo");
    nl.alt = SITE.name || "학교신문";
    nl.onload = function () { $("nameplate").hidden = false; $("masthead").hidden = true; };
    nl.src = SITE.nameLogo;
  }
  if (SITE.logo) {
    var lf = $("logoFull"), le = $("logoEmblem");
    lf.src = SITE.logo; le.src = SITE.emblem || SITE.logo;
    lf.alt = le.alt = SITE.school || "학교 로고";
    lf.hidden = le.hidden = false; $("logoRule").hidden = false;
    lf.onerror = le.onerror = function () { this.hidden = true; $("logoRule").hidden = true; };
  }
  $("masthead").textContent = SITE.name || "학교신문";
  $("copyright").textContent = "© " + new Date().getFullYear() + " " + (SITE.school || SITE.name || "");

  var cache = new Map();   // 호별로 열어 둔 신문
  var current = null;      // { count, ratio, pdf?, urls? }
  var flip = null;         // 넘김 효과 객체
  var landscape = true;
  var pageIndex = 0;
  var loadToken = 0;       // 호를 바꿀 때마다 올라간다
  var drawToken = 0;       // 화면을 다시 짤 때마다 올라간다
  var DPR = function () { return Math.min(window.devicePixelRatio || 1, 4); };
  var mainEl = document.querySelector("main"), fitBtn = $("fitBtn");
  var READABLE = 900, BIG_MAX = 1100;   // 한 면 너비(픽셀): 이보다 작으면 본문이 안 읽힌다 / 크게 보기 최대
  var bigMode = true;                   // 처음부터 읽히는 크기로 보여 준다
  try { if (localStorage.getItem("madang-fit") === "whole") bigMode = false; } catch (e) {}
  function avail() {                    // 신문을 놓을 수 있는 자리
    var cs = getComputedStyle(mainEl);
    return {
      w: Math.floor(mainEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)),
      h: Math.floor(mainEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom))
    };
  }
  fitBtn.addEventListener("click", function () {
    bigMode = !bigMode;
    try { localStorage.setItem("madang-fit", bigMode ? "big" : "whole"); } catch (e) {}
    buildBook();
  });

  /* ── 목록(드롭다운) ── */
  ISSUES.forEach(function (it, i) {
    var o = document.createElement("option");
    o.value = i; o.textContent = it.title;
    select.appendChild(o);
  });
  select.addEventListener("change", function () { openIssue(+select.value); });

  /* ── 상태 표시 ── */
  function showStatus(msg, progress) {
    statusBox.hidden = false;
    statusText.textContent = msg;
    statusBar.style.display = progress == null ? "none" : "";
    if (progress != null) statusBar.firstElementChild.style.width = Math.round(progress * 100) + "%";
  }
  function hideStatus() { statusBox.hidden = true; }

  /* ── PDF 읽기 도구는 필요할 때만 불러온다 ── */
  var pdfReady = null;
  function loadPdfLib() {
    if (!pdfReady) pdfReady = new Promise(function (ok, fail) {
      var s = document.createElement("script");
      s.src = "lib/pdf.min.js";
      s.onload = function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
        ok(window.pdfjsLib);
      };
      s.onerror = function () { fail(new Error("PDF 도구를 불러오지 못했습니다.")); };
      document.head.appendChild(s);
    });
    return pdfReady;
  }

  /* ── PDF 열기: 면을 그림 파일로 바꿔 두지 않고, 보이는 크기에 딱 맞춰 그때그때 그린다 ── */
  async function openPdf(file) {
    var lib = await loadPdfLib();
    var task = lib.getDocument({ url: file, cMapUrl: "lib/cmaps/", cMapPacked: true });
    // 파일이 열린 뒤에도 나머지를 계속 내려받으며 진행 알림이 오므로, 열린 뒤에는 무시한다
    var opened = false, myLoad = loadToken;
    task.onProgress = function (p) {
      if (opened || myLoad !== loadToken || !p || !p.total) return;
      showStatus("신문을 가져오는 중…", Math.min(1, p.loaded / p.total));
    };
    var pdf = await task.promise;
    opened = true;
    var first = await pdf.getPage(1);
    var vp = first.getViewport({ scale: 1 });
    return { pdf: pdf, count: pdf.numPages, ratio: vp.width / vp.height, pages: { 1: Promise.resolve(first) } };
  }
  function getPage(data, n) {      // n은 1부터
    if (!data.pages[n]) data.pages[n] = data.pdf.getPage(n);
    return data.pages[n];
  }
  // 한 면의 일부(또는 전체)를 캔버스에 그린다. 캔버스 크기 = 실제 화면 점 개수라서 흐려지지 않는다.
  function drawPage(data, n, canvas, cssPageWidth, offX, offY) {
    var task = null, cancelled = false;
    var done = getPage(data, n).then(function (page) {
      if (cancelled) return false;
      var base = page.getViewport({ scale: 1 });
      var dpr = DPR();
      var vp = page.getViewport({ scale: cssPageWidth * dpr / base.width });
      task = page.render({
        canvasContext: canvas.getContext("2d", { alpha: false }),
        viewport: vp,
        transform: [1, 0, 0, 1, -(offX || 0) * dpr, -(offY || 0) * dpr],
        background: "#ffffff"
      });
      return task.promise.then(function () { return true; });
    }).catch(function (e) {
      if (e && e.name === "RenderingCancelledException") return false;
      console.error(e); return false;
    });
    return { done: done, cancel: function () { cancelled = true; if (task) task.cancel(); } };
  }

  /* ── 견본 신문 (올린 PDF가 없을 때) ── */
  function renderDemo() {
    var W = 1000, H = 1414, urls = [], total = 8;
    var serif = '"Nanum Myeongjo","Noto Serif KR","Batang",serif';
    for (var p = 1; p <= total; p++) {
      var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      var c = cv.getContext("2d");
      c.fillStyle = "#f6f1e7"; c.fillRect(0, 0, W, H);
      c.fillStyle = "#1c1a18"; c.textBaseline = "top";
      var y = 60;
      if (p === 1) {
        c.textAlign = "center"; c.font = "800 96px " + serif;
        c.fillText(SITE.name || "학교신문", W / 2, y); y += 130;
        c.fillRect(60, y, W - 120, 6); y += 14; c.fillRect(60, y, W - 120, 2); y += 16;
        c.font = "22px sans-serif"; c.textAlign = "left"; c.fillText("견본 · 제0호", 60, y);
        c.textAlign = "right"; c.fillText(SITE.school || "", W - 60, y); y += 50;
      } else {
        c.font = "22px sans-serif"; c.textAlign = p % 2 ? "right" : "left";
        c.fillText(p + "면", p % 2 ? W - 60 : 60, y); y += 36;
        c.fillRect(60, y, W - 120, 2); y += 30;
      }
      c.textAlign = "left"; c.font = "800 54px " + serif;
      c.fillText("견본 기사 제목 " + p, 60, y); y += 90;
      c.fillStyle = "#cfc7b8"; c.fillRect(60, y, W - 120, 300);
      c.fillStyle = "#8d8474"; c.font = "26px sans-serif"; c.textAlign = "center";
      c.fillText("사진 자리", W / 2, y + 136); y += 330;
      c.fillStyle = "#9b9385";
      var cols = 3, gap = 30, cw = (W - 120 - gap * (cols - 1)) / cols;
      for (var k = 0; k < cols; k++) {
        for (var ly = y, i = 0; ly < H - 80; ly += 24, i++) {
          var w = (i % 7 === 6) ? cw * 0.55 : cw;
          c.fillRect(60 + k * (cw + gap), ly, w, 9);
        }
      }
      urls.push(cv.toDataURL("image/jpeg", 0.85));
    }
    return { urls: urls, count: total, ratio: W / H };
  }

  /* ── 호 열기 ── */
  async function openIssue(i) {
    var issue = ISSUES[i]; if (!issue) return;
    var token = ++loadToken;
    select.value = i;
    if (zoomOpen()) closeZoom();
    destroyBook();
    current = null;
    pageIndex = 0;
    pdfLink.hidden = !!issue.demo;
    if (!issue.demo) pdfLink.href = issue.file;
    try {
      var key = issue.demo ? "__demo" : issue.file;
      var data = cache.get(key);
      if (!data) {
        showStatus("신문을 가져오는 중…", 0);
        data = issue.demo ? renderDemo() : await openPdf(issue.file);
        if (token !== loadToken) return;
        cache.set(key, data);
      }
      current = data;
      buildBook();
      if (!issue.demo && history.replaceState) history.replaceState(null, "", "#" + (ISSUES.length - i));
    } catch (e) {
      if (token !== loadToken) return;
      console.error(e);
      current = null;
      showStatus("이 신문을 불러오지 못했습니다. 파일 이름과 위치를 확인해 주세요. (" + issue.file + ")", null);
      updateControls();
    }
  }

  function destroyBook() {
    drawToken++;
    if (flip) { try { flip.destroy(); } catch (e) {} flip = null; }
    stage.innerHTML = "";
    updateControls();
  }

  /* ── 화면 크기에 맞춰 신문을 놓는다 ── */
  function buildBook() {
    if (!current) return;
    var data = current, myDraw = ++drawToken;
    if (flip) { try { flip.destroy(); } catch (e) {} flip = null; }
    stage.innerHTML = "";

    stage.style.height = "";
    mainEl.scrollTop = 0;
    var a = avail(), W = a.w, H = a.h, r = data.ratio;
    var two = Math.min(W / 2, H * r);   // 한눈에 보기: 두 면을 펼쳤을 때 한 면의 너비
    var one = Math.min(W, H * r);       // 한눈에 보기: 한 면만 볼 때의 너비
    landscape = two >= one * 0.62;      // 화면이 넓으면 두 면 펼침, 좁으면 한 면
    var pw = Math.floor(landscape ? two : one);
    // 크게 보기: 본문이 읽히도록 한 면을 화면 너비에 맞춰 키우고, 넘치는 높이는 스크롤한다
    var canBig = W >= 700 && pw < READABLE;
    fitBtn.hidden = !canBig;
    if (canBig && bigMode) {
      if (W / 2 >= 850) { landscape = true; pw = Math.min(Math.floor(W / 2), BIG_MAX); }
      else { landscape = false; pw = Math.min(W, BIG_MAX); }
    }
    var ph = Math.floor(pw / r);
    var scrolls = ph > H;
    stage.style.height = Math.max(H, ph) + "px";
    mainEl.style.overflowY = scrolls ? "auto" : "hidden";
    fitBtn.textContent = bigMode ? "한눈에 보기" : "크게 보기";
    fitBtn.setAttribute("aria-pressed", String(bigMode));
    $("hint").textContent = (scrolls ? "아래로 스크롤해서 읽습니다 · " : "") + "면을 누르면 더 크게 볼 수 있습니다 · 넘길 때는 모서리를 끌거나 ◀ ▶";
    var dpr = DPR();

    var book = document.createElement("div");
    book.id = "book";
    var bw = landscape ? pw * 2 : pw;
    book.style.width = bw + "px";
    book.style.height = ph + "px";
    // 반 픽셀이라도 어긋나면 글자가 번지므로 위치를 정수 픽셀에 맞춘다
    book.style.left = Math.floor((W - bw) / 2) + "px";
    book.style.top = Math.max(0, Math.floor((H - ph) / 2)) + "px";
    book.dataset.pw = pw;
    var inner = document.createElement("div");
    var canvases = [];
    for (var n = 0; n < data.count; n++) {
      var d = document.createElement("div"); d.className = "page";
      if (data.urls) {
        var img = document.createElement("img");
        img.src = data.urls[n]; img.alt = (n + 1) + "면"; img.draggable = false;
        d.appendChild(img);
      } else {
        var cv = document.createElement("canvas");
        cv.width = Math.round(pw * dpr); cv.height = Math.round(ph * dpr);
        cv.setAttribute("role", "img"); cv.setAttribute("aria-label", (n + 1) + "면");
        d.appendChild(cv); canvases.push(cv);
      }
      inner.appendChild(d);
    }
    book.appendChild(inner);
    stage.appendChild(book);

    pageIndex = Math.min(pageIndex, data.count - 1);
    flip = new St.PageFlip(inner, {
      width: pw, height: ph, size: "stretch",
      minWidth: landscape ? Math.floor(pw / 2) : pw, maxWidth: 4000,
      minHeight: 50, maxHeight: 6000,
      showCover: true, usePortrait: true, autoSize: true,
      drawShadow: true, maxShadowOpacity: 0.55,
      flippingTime: 900, startPage: pageIndex,
      mobileScrollSupport: scrolls, swipeDistance: 20,
      disableFlipByClick: true        // 면을 누르면 넘기지 않고 확대한다 (모서리는 그대로 넘김)
    });
    flip.loadFromHTML(inner.querySelectorAll(".page"));
    flip.on("flip", function (e) {
      pageIndex = e.data; updateControls();
      if (mainEl.scrollTop > 0) mainEl.scrollTo({ top: 0, behavior: "smooth" });   // 새 면은 맨 위부터
    });
    updateControls();

    if (data.urls) { hideStatus(); return; }
    // 지금 보이는 면부터 가까운 순서로 그린다
    var order = canvases.map(function (_, k) { return k; })
      .sort(function (a, b) { return Math.abs(a - pageIndex) - Math.abs(b - pageIndex); });
    showStatus("신문을 펼치는 중…", null);
    var next = 0, drawn = 0;
    async function worker() {             // 세 면씩 동시에 그려서 빈 면이 보이는 시간을 줄인다
      while (next < order.length && myDraw === drawToken) {
        var k = order[next++];
        await drawPage(data, k + 1, canvases[k], pw).done;
        if (myDraw !== drawToken) return;
        canvases[k].dataset.done = "1";
        if (++drawn === 1) hideStatus();
      }
    }
    worker(); worker(); worker();
  }

  function updateControls() {
    var n = current && flip ? current.count : 0;
    var book = $("book");
    if (!n) {
      prevBtn.disabled = nextBtn.disabled = zoomBtn.disabled = true;
      pageInfo.textContent = "–";
      return;
    }
    // 펼침 보기에서는 1면만 혼자, 그 뒤로는 두 면씩 보인다
    var pair = landscape && pageIndex > 0 && pageIndex + 1 < n;
    var isLast = landscape ? (pageIndex === 0 ? n <= 1 : pageIndex + 2 > n - 1) : pageIndex >= n - 1;
    zoomBtn.disabled = false;
    prevBtn.disabled = pageIndex <= 0;
    nextBtn.disabled = isLast;
    pageInfo.textContent = (pair ? (pageIndex + 1) + "–" + (pageIndex + 2) : (pageIndex + 1)) + " / " + n + "면";
    // 첫 면·마지막 면은 한 장만 보이므로 가운데로 옮긴다
    if (book) {
      var shift = 0;
      if (landscape && n > 1) {
        var half = Math.round((+book.dataset.pw || 0) / 2);
        if (pageIndex === 0) shift = -half;
        else if (!pair) shift = half;
      }
      book.style.transform = shift ? "translateX(" + shift + "px)" : "";
    }
  }

  /* ── 조작 ── */
  prevBtn.addEventListener("click", function () { if (flip) flip.flipPrev(); });
  nextBtn.addEventListener("click", function () { if (flip) flip.flipNext(); });
  document.addEventListener("keydown", function (e) {
    if (zoomOpen()) {
      if (e.key === "Escape") closeZoom();
      else if (e.key === "+" || e.key === "=") setZoom(zLevel * 1.4);
      else if (e.key === "-") setZoom(zLevel / 1.4);
      return;
    }
    if (!flip || e.target === select) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") flip.flipNext();
    else if (e.key === "ArrowLeft" || e.key === "PageUp") flip.flipPrev();
  });

  /* ── 확대 보기 ──
     확대하거나 움직일 때마다, 지금 화면에 보이는 부분만 그 크기에 딱 맞춰 PDF에서 다시 그린다.
     그래서 아무리 확대해도 글자가 깨지지 않는다. */
  var zoomBox = $("zoom"), zoomInner = $("zoomInner"), zoomBar = $("zoomBar"), zoomBtn = $("zoomBtn");
  var zLevel = 1, zPages = [], Z_MIN = 1, Z_MAX = 12, sharpTimer = null, sharpJobs = [];

  function zoomOpen() { return !zoomBox.hidden; }
  function viewPages() {
    var n = current.count;
    if (landscape && pageIndex > 0 && pageIndex + 1 < n) return [pageIndex, pageIndex + 1];
    return [pageIndex];
  }
  // 배율을 바꾸되, 화면의 (cx, cy) 지점이 가리키던 곳이 그대로 있도록 스크롤을 맞춘다
  function setZoom(z, cx, cy) {
    z = Math.max(Z_MIN, Math.min(Z_MAX, z));
    var vw = zoomBox.clientWidth, vh = zoomBox.clientHeight;
    if (cx == null) { cx = vw / 2; cy = vh / 2; }
    var oldW = zoomInner.offsetWidth || vw;
    var fx = (zoomBox.scrollLeft + cx) / oldW, fy = (zoomBox.scrollTop + cy) / oldW;
    var newW = Math.round(vw * z);
    newW -= newW % (zPages.length || 1);      // 면 너비가 정수 픽셀이 되도록
    zoomInner.style.width = newW + "px";
    zLevel = z;
    zoomBox.scrollLeft = fx * newW - cx;
    zoomBox.scrollTop = fy * newW - cy;
    scheduleSharp();
  }
  function scheduleSharp() {
    clearTimeout(sharpTimer);
    sharpTimer = setTimeout(sharpen, 140);
  }
  function sharpen() {
    if (!zoomOpen() || !current || !current.pdf) return;
    var data = current;
    sharpJobs.forEach(function (j) { j.cancel(); });
    sharpJobs = [];
    var vw = zoomBox.clientWidth, vh = zoomBox.clientHeight, dpr = DPR();
    var box = zoomBox.getBoundingClientRect();
    // 화면보다 조금 넓게 그려 두어 살짝 움직여도 선명하게 (캔버스가 너무 커지지 않는 선에서)
    var pad = Math.min(vw, vh) * 0.3;
    while (pad > 0 && (vw + 2 * pad) * (vh + 2 * pad) * dpr * dpr > 14e6) pad = Math.floor(pad / 2);
    zPages.forEach(function (zp) {
      var r = zp.el.getBoundingClientRect();
      var snap = function (v) { return Math.round(v * dpr) / dpr; };   // 화면 점 격자에 맞춘다
      var x0 = snap(Math.max(r.left, box.left - pad)), y0 = snap(Math.max(r.top, box.top - pad));
      var x1 = snap(Math.min(r.right, box.left + vw + pad)), y1 = snap(Math.min(r.bottom, box.top + vh + pad));
      if (x1 - x0 < 2 || y1 - y0 < 2) return;
      var cv = document.createElement("canvas");
      cv.width = Math.round((x1 - x0) * dpr); cv.height = Math.round((y1 - y0) * dpr);
      cv.className = "sharp";
      // 위치·크기를 면에 대한 비율로 적어 두면, 다시 그리기 전에 확대해도 제자리에 붙어 있다
      cv.style.left = (x0 - r.left) / r.width * 100 + "%";
      cv.style.top = (y0 - r.top) / r.height * 100 + "%";
      cv.style.width = (x1 - x0) / r.width * 100 + "%";
      cv.style.height = (y1 - y0) / r.height * 100 + "%";
      var job = drawPage(data, zp.n + 1, cv, r.width, x0 - r.left, y0 - r.top);
      sharpJobs.push(job);
      job.done.then(function (ok) {
        if (!ok || !zp.el.isConnected) return;
        var old = zp.el.querySelectorAll("canvas.sharp");
        zp.el.appendChild(cv);
        old.forEach(function (o) { o.remove(); });
      });
    });
  }
  // at: 넘겨보기 화면에서 누른 지점 {fx: 가로 비율, fyW: 세로 위치 ÷ 전체 너비}. 없으면 맨 위 가운데.
  function openZoom(at) {
    if (!current || !flip || zoomOpen()) return;
    var data = current, pages = viewPages();
    zoomInner.innerHTML = "";
    var flipCanvases = stage.querySelectorAll(".page canvas");
    zPages = pages.map(function (n) {
      var el = document.createElement("div"); el.className = "zpage";
      el.style.aspectRatio = String(data.ratio);
      if (data.urls) {
        var img = document.createElement("img"); img.src = data.urls[n]; img.alt = (n + 1) + "면"; img.draggable = false;
        el.appendChild(img);
      } else if (flipCanvases[n]) {
        // 선명한 그림이 준비되기 전까지 넘겨보기 화면의 그림을 잠깐 깔아 둔다
        var ph = document.createElement("canvas"); ph.className = "base";
        ph.width = flipCanvases[n].width; ph.height = flipCanvases[n].height;
        try { ph.getContext("2d").drawImage(flipCanvases[n], 0, 0); } catch (e) {}
        el.appendChild(ph);
      }
      zoomInner.appendChild(el);
      return { n: n, el: el };
    });
    zoomBox.hidden = false; zoomBar.hidden = false;
    zoomInner.style.width = zoomBox.clientWidth + "px";
    zoomBox.scrollLeft = zoomBox.scrollTop = 0;
    // 처음 배율: 한 면의 너비가 1100픽셀쯤(본문 글씨가 편하게 읽히는 크기) 되도록
    var vw = zoomBox.clientWidth, vh = zoomBox.clientHeight;
    var bookEl = $("book"), curPw = bookEl ? +bookEl.dataset.pw : 0;
    var z0 = Math.max(1100, Math.round(curPw * 1.5)) * zPages.length / vw;
    if (vw < 700) z0 = Math.max(z0, 1.15);
    Z_MIN = Math.min(1, z0);            // 넓은 화면에서는 화면 너비보다 작게도 볼 수 있다
    setZoom(z0, 0, 0);
    var w = zoomInner.offsetWidth;
    zoomBox.scrollLeft = (at ? at.fx : 0.5) * w - vw / 2;
    zoomBox.scrollTop = at ? at.fyW * w - vh / 2 : 0;
    scheduleSharp();
    $("zoomClose").focus({ preventScroll: true });
  }
  function closeZoom() {
    clearTimeout(sharpTimer);
    sharpJobs.forEach(function (j) { j.cancel(); }); sharpJobs = [];
    zoomBox.hidden = true; zoomBar.hidden = true; zoomInner.innerHTML = ""; zPages = [];
    zoomBtn.focus();
  }
  zoomBtn.addEventListener("click", function () { openZoom(); });
  // 넘겨보기 화면에서 면을 누르면 그 자리를 확대한다 (모서리는 넘김용이라 제외)
  var lastTapZoom = 0;
  stage.addEventListener("click", function (e) {
    if (Date.now() - lastTapZoom < 700) return;     // 손가락 터치로 이미 처리한 경우
    zoomAt(e.clientX, e.clientY);
  });
  // 터치 화면: 넘김 효과가 터치를 가로채서 click이 오지 않으므로 '톡 누르기'를 직접 알아챈다
  var tap = null;
  stage.addEventListener("touchstart", function (e) {
    var t = e.touches;
    tap = t.length === 1 ? { x: t[0].clientX, y: t[0].clientY, at: Date.now() } : null;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (!tap || e.touches.length) { tap = null; return; }
    var t = e.changedTouches[0], was = tap; tap = null;
    if (Date.now() - was.at > 350 || Math.hypot(t.clientX - was.x, t.clientY - was.y) > 10) return;
    lastTapZoom = Date.now();
    setTimeout(function () { zoomAt(was.x, was.y); }, 0);
  }, { passive: true });
  function zoomAt(clientX, clientY) {
    var e = { clientX: clientX, clientY: clientY };
    var book = $("book");
    if (!book || !flip || !current || zoomOpen()) return;
    var pages = viewPages(), pw = +book.dataset.pw, r = book.getBoundingClientRect();
    // 지금 보이는 면들이 차지하는 영역
    var left = r.left + (landscape && pageIndex === 0 ? pw : 0);
    var width = pw * pages.length, top = r.top, height = r.height;
    var x = e.clientX - left, y = e.clientY - top;
    if (x < 0 || y < 0 || x > width || y > height) return;
    var corner = Math.sqrt(pw * pw + height * height) / 5;
    var nearX = Math.min(x, width - x), nearY = Math.min(y, height - y);
    if (Math.hypot(nearX, nearY) < corner) return;
    openZoom({ fx: x / width, fyW: y / width });
  }
  $("zoomClose").addEventListener("click", closeZoom);
  $("zoomIn").addEventListener("click", function () { setZoom(zLevel * 1.4); });
  $("zoomOut").addEventListener("click", function () { setZoom(zLevel / 1.4); });
  zoomBox.addEventListener("scroll", scheduleSharp, { passive: true });
  // 마우스: 끌지 않고 그냥 누르면 넘겨보기 화면으로 돌아간다
  zoomBox.addEventListener("pointerdown", function (e) { zoomBox.classList.toggle("mouse", e.pointerType === "mouse"); });
  zoomBox.addEventListener("click", function (e) {
    if (zoomBox.classList.contains("mouse") && !dragMoved) closeZoom();
  });
  zoomBox.addEventListener("wheel", function (e) {
    if (!e.ctrlKey && !e.metaKey) return;      // 그냥 휠은 위아래 이동, Ctrl+휠은 확대
    e.preventDefault();
    setZoom(zLevel * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });
  // 마우스로 끌어서 이동
  var drag = null, dragMoved = false;
  zoomBox.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    dragMoved = false;
    drag = { x: e.clientX, y: e.clientY, l: zoomBox.scrollLeft, t: zoomBox.scrollTop };
    zoomBox.classList.add("dragging"); e.preventDefault();
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) dragMoved = true;
    zoomBox.scrollLeft = drag.l - (e.clientX - drag.x);
    zoomBox.scrollTop = drag.t - (e.clientY - drag.y);
  });
  window.addEventListener("mouseup", function () { drag = null; zoomBox.classList.remove("dragging"); });
  // 두 손가락으로 벌리고 오므리기
  var pinch = null;
  function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  zoomBox.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zLevel };
  }, { passive: true });
  zoomBox.addEventListener("touchmove", function (e) {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    var t = e.touches;
    setZoom(pinch.z * dist(t) / pinch.d, (t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);
  }, { passive: false });
  zoomBox.addEventListener("touchend", function (e) { if (e.touches.length < 2) pinch = null; });
  // 넘겨보는 화면에서 두 손가락을 벌리면 확대 보기가 열린다
  var stagePinch = null;
  stage.addEventListener("touchstart", function (e) {
    stagePinch = e.touches.length === 2 ? dist(e.touches) : null;
  }, { passive: true });
  stage.addEventListener("touchmove", function (e) {
    if (stagePinch && e.touches.length === 2 && dist(e.touches) > stagePinch * 1.25) { stagePinch = null; openZoom(); }
  }, { passive: true });

  var root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener("click", function () {
    var on = document.fullscreenElement || document.webkitFullscreenElement;
    if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  });

  var resizeTimer = null, lastW = 0, lastH = 0, lastDpr = DPR();
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (zoomOpen()) setZoom(zLevel);
      var a = avail();
      if (a.w === lastW && a.h === lastH && DPR() === lastDpr) return;
      lastW = a.w; lastH = a.h; lastDpr = DPR();
      buildBook();
    }, 200);
  });

  /* ── 시작: 주소 끝의 #번호로 특정 호를 바로 열 수 있다 ── */
  var start = 0, h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= ISSUES.length) start = ISSUES.length - h;
  lastW = avail().w; lastH = avail().h;
  openIssue(start);
})();
</script>
</body>
</html>
